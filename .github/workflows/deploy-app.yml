name: Deploy Site and API

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      staticWebAppName:
        description: Naam van de target Static Web App
        required: true
      azureResourceGroup:
        description: Azure resource group met de Static Web App
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SWA_NAME: ${{ github.event.inputs.staticWebAppName || vars.STATIC_WEB_APP_NAME }}
      AZURE_RG: ${{ github.event.inputs.azureResourceGroup || vars.AZURE_RG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read SWA deployment token
        id: swa_token
        run: |
          if [ -z "$SWA_NAME" ] || [ -z "$AZURE_RG" ]; then
            echo "STATIC_WEB_APP_NAME of AZURE_RG ontbreekt (repo vars of workflow inputs)."
            exit 1
          fi
          TOKEN=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$AZURE_RG" \
            --query properties.apiKey \
            --output tsv)
          if [ -z "$TOKEN" ]; then
            echo "Kon geen deployment token ophalen."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy Static Web App + API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: api
          output_location: ''
