<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crown of the Farlands</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Crown of the Farlands</h1>
        <p class="subtitle">Een kaart. Twaalf gebieden. Jouw volgende zet.</p>
      </header>

      <section class="map-panel" aria-labelledby="map-heading">
        <div class="map-heading">
          <div>
            <h2 id="map-heading">De wereldkaart</h2>
            <p>Een verre wereld van ruige kusten, droge hooglanden en lange routes.</p>
          </div>
          <div class="map-key" role="group" aria-label="Kaartlegenda">
            <span class="map-key-armies">
              <span class="map-key-swatch map-key-swatch--armies" aria-hidden="true"></span>
              Legers
            </span>
            <div id="map-player-legend" class="map-player-legend" role="list" aria-label="Spelers en kleuren"></div>
          </div>
        </div>
        <div class="map-frame">
          <svg
            id="game-map"
            class="game-map"
            viewBox="0 0 1000 730"
            role="group"
            aria-label="Spelwereld met meerdere continenten en twaalf verbonden gebieden"
          >
            <defs>
              <pattern id="sea-grid" width="48" height="48" patternUnits="userSpaceOnUse">
                <path d="M48 0H0V48" fill="none" stroke="#8eb0a4" stroke-opacity=".08" stroke-width="1" />
              </pattern>
            </defs>
            <rect class="map-sea" width="1000" height="730" />
            <rect class="map-grid" width="1000" height="730" fill="url(#sea-grid)" />

            </g>
            <text class="map-sea-label" x="77" y="87">KOBALTZEE</text>
            <text class="map-sea-label" x="812" y="126">DE VERRE STROOM</text>
            <text class="map-sea-label" x="455" y="705">ZUIDELIJKE DOORGANG</text>
            <g id="map-routes" aria-hidden="true"></g>
            <text class="map-region-label" x="428" y="180" text-anchor="middle">ZOUTRUG</text>
            <text class="map-region-label" x="214" y="410" text-anchor="middle">KOPERKUST</text>
            <text class="map-region-label" x="493" y="388" text-anchor="middle">STOFPLATEAU</text>
            <text class="map-region-label" x="764" y="405" text-anchor="middle">GLASLAND</text>
            <text class="map-region-label" x="185" y="620" text-anchor="middle">VERRE WESTEN</text>
            <text class="map-region-label" x="788" y="610" text-anchor="middle">ZUIDERLAND</text>
            <g id="territory-list"></g>
            <g class="compass" transform="translate(923 98)" aria-hidden="true">
              <path d="M0 -28 L8 0 L0 28 L-8 0 Z" />
              <text x="0" y="-38" text-anchor="middle">N</text>
            </g>
          </svg>
        </div>
      </section>

      <details class="panel" id="connection-panel" open>
        <summary class="panel-summary">
          <h2>Verbinding</h2>
          <span id="connection-status" class="status">Niet verbonden</span>
        </summary>
        <div class="grid-2">
          <label>
            Jouw naam
            <input id="player-name" type="text" maxlength="24" placeholder="Bijv. Robin" />
          </label>
          <label>
            Kamercode (automatisch)
            <input id="room-code" type="text" maxlength="24" readonly aria-describedby="room-code-help" />
            <small id="room-code-help" class="field-hint">
              Automatisch aangemaakt. Deel de uitnodigingslink om anderen uit te nodigen.
            </small>
          </label>
        </div>
        <div class="actions">
          <button id="connect-btn">Verbinden</button>
        </div>
      </details>

      <details class="panel" id="lobby-panel" open>
        <summary class="panel-summary">
          <h2>Lobby</h2>
          <span id="host-label" class="status">Host: onbekend</span>
        </summary>
        <div class="actions">
          <button id="start-game-btn" disabled>Spel starten</button>
          <button id="copy-invite-btn" disabled>Uitnodigingslink kopiëren</button>
        </div>
        <div id="players-list" class="chips"></div>
      </details>

      <section class="panel" id="game-panel">
        <h2>Spel</h2>
        <div id="game-meta" class="meta"></div>
        <div id="phase-actions" class="phase-actions"></div>
        <div id="attack-controls" class="inline-form"></div>
        <div id="fortify-controls" class="inline-form"></div>
      </section>

      <section class="panel">
        <h2>Logboek</h2>
        <ul id="log-list" class="log-list"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <span>Versie <span id="app-version" aria-live="polite">Laden...</span></span>
      <span>Gebouwd door <a href="https://peterrombouts.nl">Peter Rombouts</a></span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
